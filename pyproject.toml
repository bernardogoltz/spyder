# Este arquivo impede o uv de subir a árvore e achar um pyproject.toml pai.
#
# O pacote `spyder` continua definido em setup.py (setuptools). Não declare
# [project] aqui: o setuptools passaria a tratá-lo como fonte da verdade.
#
# Este fork é consumido pelo launcher `setup-spyder` (submódulo setup-spyder/)
# por URL Git pinada, nunca por path local. Ambiente de desenvolvimento deste
# checkout: veja README.md e .claude/skills/spyder-dev-ambiente/SKILL.md.

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[tool.uv]
managed = false
