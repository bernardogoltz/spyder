[pytest]
testpaths = tests
python_files = test_*.py
addopts = -ra --strict-markers
markers =
    phase0: Fase 0 - baseline e ADR (contratos publicos atuais)
    phase1: Fase 1 - prototipo vertical do terminal (PTY)
    phase2: Fase 2 - refatoracao do launcher e perfis
    phase3: Fase 3 - plugin minimo
    phase4: Fase 4 - provedores codex/claude
    phase5: Fase 5 - polimento da instancia
    phase6: Fase 6 - empacotamento e release
    unit: testes unitarios, sem Qt e sem subprocesso pesado
    qt: exige pytest-qt e um QApplication
    pty: exige um backend PTY/ConPTY real
    integration: subprocesso real, wheel ou config em disco
    e2e: abre o Spyder de verdade (opt-in via SETUP_SPYDER_E2E=1)
    slow: importa o Spyder ou espera processos
